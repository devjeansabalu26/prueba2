name: API Contactos CI/CD

on:
  push:
    branches: ["main"]

env:
  IMAGE_BASE_NAME: jean/apicontactos

jobs:
  API_Image:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/ApiContactos

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build Docker NET image
        run: |
          docker build --platform linux -t $IMAGE_BASE_NAME:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy image to hub
        run: |
          docker push $IMAGE_BASE_NAME:latest
